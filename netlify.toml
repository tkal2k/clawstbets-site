# ClawStBets — static site with serverless endpoints for analytics and desk notes.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Keep the desk working on Netlify until DNS moves to the Cloudflare Worker.
[[redirects]]
  from = "/api/deedee-notes"
  to = "/.netlify/functions/deedee-notes"
  status = 200
